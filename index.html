<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Video Player</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --accent: #e8c87a;
    --danger: #ff4f4f;
    --muted: rgba(255,255,255,0.28);
  }

  html, body { height: 100%; background: #000; overflow: hidden; }

  .app { position: fixed; inset: 0; background: #000; }

  video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: contain;
  }

  /* ─── BLACKOUT ─── */
  .blur-overlay {
    position: absolute; inset: 0;
    background: #000; z-index: 10;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s;
  }
  .blur-overlay.active { opacity: 1; pointer-events: auto; }

  /* ─── PLAY BUTTON ─── */
  .play-toggle {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 20;
    width: 72px; height: 72px;
    border-radius: 50%;
    background: var(--accent);
    border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 32px rgba(232,200,122,0.35);
    opacity: 0; pointer-events: none;
    transition: opacity 0.4s ease;
  }
  .app.ui-visible .play-toggle { opacity: 1; pointer-events: auto; }
  .play-toggle:active { filter: brightness(1.15); }

  .play-icon, .pause-icon {
    position: absolute;
    transition: opacity 0.2s, transform 0.2s;
  }
  .play-toggle.paused  .play-icon  { opacity: 1; transform: translateX(2px); }
  .play-toggle.paused  .pause-icon { opacity: 0; transform: scale(0.7); }
  .play-toggle.playing .play-icon  { opacity: 0; transform: scale(0.7); }
  .play-toggle.playing .pause-icon { opacity: 1; transform: none; }

  /* ─── CONTROLS ─── */
  .controls {
    position: absolute;
    bottom: 0; left: 0; right: 0; z-index: 20;
    padding: 24px 16px max(16px, env(safe-area-inset-bottom));
    background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, transparent 100%);
    display: flex; flex-direction: column; gap: 6px;
    opacity: 0; pointer-events: none;
    transition: opacity 0.4s ease;
  }
  .app.ui-visible .controls { opacity: 1; pointer-events: auto; }

  .seekbar-row { display: flex; align-items: center; gap: 10px; }
  .time-label {
    font-family: 'Courier New', monospace;
    font-size: 11px; color: var(--muted);
    white-space: nowrap; min-width: 82px; text-align: right;
  }
  input[type=range] {
    -webkit-appearance: none;
    width: 100%; height: 3px; border-radius: 2px;
    background: linear-gradient(to right, var(--accent) var(--p, 0%), rgba(255,255,255,0.15) var(--p, 0%));
    outline: none; cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--accent); cursor: pointer;
    box-shadow: 0 0 6px rgba(232,200,122,0.6);
  }

  /* ─── MIC BUTTON ─── */
  .mic-btn {
    position: absolute;
    top: max(16px, env(safe-area-inset-top));
    right: 16px;
    z-index: 25;
    width: 58px; height: 58px;
    border-radius: 50%;
    background: rgba(0,0,0,0.5);
    border: 2px solid rgba(255,255,255,0.3);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    transition: border-color 0.2s, background 0.2s;
  }
  .mic-btn:active { transform: scale(0.92); }
  .mic-btn.listening {
    background: rgba(255,40,40,0.2);
    border-color: var(--danger);
    animation: micPulse 1s ease-in-out infinite;
  }
  @keyframes micPulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(255,79,79,0.5); }
    50%      { box-shadow: 0 0 0 14px rgba(255,79,79,0); }
  }

  /* ─── TOAST ─── */
  .toast {
    position: absolute;
    bottom: 28%; left: 50%;
    transform: translateX(-50%);
    z-index: 30;
    background: rgba(0,0,0,0.72);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 14px;
    padding: 10px 22px;
    font-family: sans-serif; font-size: 14px; color: #fff;
    pointer-events: none; opacity: 0;
    transition: opacity 0.25s ease;
    white-space: nowrap;
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
  }
  .toast.show { opacity: 1; }

  #fileInput { display: none; }
</style>
</head>
<body>

<div class="app" id="app">
  <video id="video" preload="auto"></video>
  <div class="blur-overlay" id="blurOverlay"></div>
  <div class="toast" id="toast"></div>
  <input type="file" id="fileInput" accept="video/*">

  <!-- 再生ボタン（中央） -->
  <button class="play-toggle paused" id="playBtn">
    <span class="play-icon">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="#080a0d">
        <polygon points="5,2 19,11 5,20"/>
      </svg>
    </span>
    <span class="pause-icon">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="#080a0d">
        <rect x="2" y="1" width="6" height="18" rx="2"/>
        <rect x="12" y="1" width="6" height="18" rx="2"/>
      </svg>
    </span>
  </button>

  <!-- シークバー -->
  <div class="controls">
    <div class="seekbar-row">
      <input type="range" id="seek" min="0" max="100" value="0" step="0.01">
      <div class="time-label" id="timeLabel">0:00 / 0:00</div>
    </div>
  </div>

  <!-- マイクボタン（右上・常時表示） -->
  <button class="mic-btn" id="btnMic" title="音声コントロール">
    <svg id="micSvg" width="30" height="30" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- マイク本体 -->
      <rect x="10" y="2" width="10" height="16" rx="5" fill="white"/>
      <!-- スタンド弧 -->
      <path d="M5 15c0 5.52 4.48 10 10 10s10-4.48 10-10" stroke="white" stroke-width="2.2" stroke-linecap="round" fill="none"/>
      <!-- 軸 -->
      <line x1="15" y1="25" x2="15" y2="28" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
      <!-- 台座 -->
      <line x1="10" y1="28" x2="20" y2="28" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
      <!-- 電波 左 -->
      <path d="M3.5 11 Q1 15 3.5 19" stroke="white" stroke-width="2" stroke-linecap="round" fill="none"/>
      <path d="M0.5 8.5 Q-2.5 15 0.5 21.5" stroke="white" stroke-width="2" stroke-linecap="round" fill="none"/>
      <!-- 電波 右 -->
      <path d="M26.5 11 Q29 15 26.5 19" stroke="white" stroke-width="2" stroke-linecap="round" fill="none"/>
      <path d="M29.5 8.5 Q32.5 15 29.5 21.5" stroke="white" stroke-width="2" stroke-linecap="round" fill="none"/>
    </svg>
  </button>
</div>

<script>
  const video       = document.getElementById('video');
  const playBtn     = document.getElementById('playBtn');
  const seek        = document.getElementById('seek');
  const timeLabel   = document.getElementById('timeLabel');
  const blurOverlay = document.getElementById('blurOverlay');
  const fileInput   = document.getElementById('fileInput');
  const app         = document.getElementById('app');
  const btnMic      = document.getElementById('btnMic');
  const micSvg      = document.getElementById('micSvg');
  const toast       = document.getElementById('toast');

  let blurOn       = false;
  let pausedByMode = false;
  let uiTimer      = null;
  let isListening  = false;
  let recognition  = null;
  let toastTimer   = null;

  // ── UI 表示（5秒で消える）──
  function showUI() {
    app.classList.add('ui-visible');
    clearTimeout(uiTimer);
    uiTimer = setTimeout(() => app.classList.remove('ui-visible'), 5000);
  }
  app.addEventListener('click', showUI);
  app.addEventListener('touchstart', showUI, { passive: true });
  document.querySelectorAll('input[type=range], button').forEach(el => {
    el.addEventListener('pointerdown', showUI);
  });

  // ── ファイル ──
  fileInput.addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file || !file.type.startsWith('video/')) return;
    video.src = URL.createObjectURL(file);
    video.load();
    updatePlayBtn();
  });

  // ── 再生 ──
  function updatePlayBtn() {
    const playing = !video.paused && !video.ended;
    playBtn.classList.toggle('playing', playing);
    playBtn.classList.toggle('paused', !playing);
  }
  function togglePlay() {
    if (!video.src) return;
    video.paused ? video.play() : video.pause();
  }
  playBtn.addEventListener('click', e => { e.stopPropagation(); togglePlay(); });
  video.addEventListener('play',  updatePlayBtn);
  video.addEventListener('pause', updatePlayBtn);
  video.addEventListener('ended', updatePlayBtn);

  // ── シーク ──
  video.addEventListener('timeupdate', () => {
    if (!video.duration) return;
    const pct = (video.currentTime / video.duration) * 100;
    seek.value = pct;
    seek.style.setProperty('--p', pct + '%');
    timeLabel.textContent = fmtTime(video.currentTime) + ' / ' + fmtTime(video.duration);
  });
  seek.addEventListener('input', () => {
    if (!video.duration) return;
    video.currentTime = (seek.value / 100) * video.duration;
    seek.style.setProperty('--p', seek.value + '%');
    showUI();
  });
  function fmtTime(s) {
    const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = Math.floor(s%60);
    return h > 0
      ? `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`
      : `${m}:${String(sec).padStart(2,'0')}`;
  }

  // ── ぼかし ──
  function applyBlur(on) {
    blurOn = on;
    blurOverlay.classList.toggle('active', on);
    if (on) {
      if (!video.paused) { video.pause(); pausedByMode = true; }
    } else {
      if (pausedByMode) { video.play().catch(()=>{}); pausedByMode = false; }
    }
    video.muted = on;
  }

  // ── トースト ──
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
  }

  // ── マイクアイコン色変更 ──
  function setMicColor(listening) {
    const color = listening ? '#ff4f4f' : 'white';
    micSvg.querySelectorAll('rect, path, line').forEach(el => {
      if (el.hasAttribute('fill') && el.getAttribute('fill') !== 'none') el.setAttribute('fill', color);
      if (el.hasAttribute('stroke') && el.getAttribute('stroke') !== 'none') el.setAttribute('stroke', color);
    });
  }

  // ── 秒数パース ──
  function parseSeconds(text) {
    let total = 0;
    const min = text.match(/(\d+)\s*分/);
    const sec = text.match(/(\d+)\s*秒/);
    if (min) total += parseInt(min[1]) * 60;
    if (sec) total += parseInt(sec[1]);
    return total || 10;
  }

  // ── コマンド処理 ──
  function handleCommand(text) {
    text = text.replace(/\s/g, '');
    showUI();
    if (/再生|プレイ/.test(text)) {
      video.play().catch(()=>{});
      showToast('▶ 再生');
    } else if (/止|停止|ポーズ|一時停止/.test(text)) {
      video.pause();
      showToast('⏸ 一時停止');
    } else if (/戻|巻き戻/.test(text)) {
      const s = parseSeconds(text);
      video.currentTime = Math.max(0, video.currentTime - s);
      showToast(`⏪ ${s}秒戻しました`);
    } else if (/進|スキップ|飛ば/.test(text)) {
      const s = parseSeconds(text);
      video.currentTime = Math.min(video.duration||0, video.currentTime + s);
      showToast(`⏩ ${s}秒進みました`);
    } else if (/最初|はじめ|先頭/.test(text)) {
      video.currentTime = 0;
      showToast('⏮ 最初から');
    } else if (/ぼかし/.test(text) && /オン|on|入|つけ|開始/i.test(text)) {
      applyBlur(true);
      showToast('🔒 ぼかし ON');
    } else if (/ぼかし/.test(text) && /オフ|off|切|消|解除/i.test(text)) {
      applyBlur(false);
      showToast('🔓 ぼかし OFF');
    } else if (/ファイル|動画|開|選択/.test(text)) {
      fileInput.click();
      showToast('📂 ファイル選択');
    } else {
      showToast(`「${text}」— 認識できませんでした`);
    }
  }

  // ── 音声認識セットアップ ──
  function setupRecognition() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { showToast('このブラウザは音声認識非対応です'); return null; }
    const r = new SR();
    r.lang = 'ja-JP';
    r.continuous = false;
    r.interimResults = false;
    r.onresult = e => handleCommand(e.results[0][0].transcript);
    r.onend = () => {
      isListening = false;
      btnMic.classList.remove('listening');
      setMicColor(false);
    };
    r.onerror = e => {
      isListening = false;
      btnMic.classList.remove('listening');
      setMicColor(false);
      if (e.error !== 'no-speech') showToast('エラー: ' + e.error);
    };
    return r;
  }

  btnMic.addEventListener('click', e => {
    e.stopPropagation();
    if (isListening) { recognition && recognition.stop(); return; }
    recognition = setupRecognition();
    if (!recognition) return;
    isListening = true;
    btnMic.classList.add('listening');
    setMicColor(true);
    showToast('🎤 聞いています…');
    recognition.start();
  });

  // ── キーボード ──
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.code === 'Space')      { e.preventDefault(); togglePlay(); }
    if (e.code === 'ArrowLeft')  { e.preventDefault(); video.currentTime = Math.max(0, video.currentTime - 10); }
    if (e.code === 'ArrowRight') { e.preventDefault(); video.currentTime = Math.min(video.duration||0, video.currentTime + 10); }
  });
</script>
</body>
</html>
