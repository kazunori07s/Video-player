<!DOCTYPE html><html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>3D CAD Studio</title>
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}body{ overflow:hidden; background:#0f1115; font-family:Arial, sans-serif; color:white; }

#ui{ position:absolute; top:15px; left:15px; z-index:10; width:260px; background:rgba(20,20,20,0.9); border:1px solid #333; border-radius:16px; padding:16px; backdrop-filter:blur(10px); }

#ui h1{ font-size:22px; margin-bottom:14px; }

button{ width:100%; padding:12px; margin-bottom:10px; border:none; border-radius:12px; background:#1f6fff; color:white; font-size:15px; cursor:pointer; transition:0.2s; }

button:hover{ transform:scale(1.03); background:#4488ff; }

.range-group{ margin-top:14px; }

label{ display:block; margin-bottom:6px; font-size:14px; }

input[type=range]{ width:100%; }

.info{ margin-top:14px; font-size:13px; color:#ccc; line-height:1.5; }

canvas{ display:block; } </style>

</head>
<body><div id="ui">
  <h1>3D CAD Studio</h1><button onclick="addCube()">立方体追加</button> <button onclick="addSphere()">球体追加</button> <button onclick="addCylinder()">円柱追加</button> <button onclick="deleteSelected()">選択削除</button>

  <div class="range-group">
    <label>サイズ</label>
    <input type="range" min="0.5" max="5" step="0.1" value="1" id="scaleSlider">
  </div>  <div class="range-group">
    <label>回転</label>
    <input type="range" min="0" max="360" step="1" value="0" id="rotateSlider">
  </div>  <div class="info">
    ・ドラッグで視点回転<br>
    ・ホイールでズーム<br>
    ・オブジェクトクリックで選択<br>
    ・まるで工房のように編集可能です。
  </div>
</div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.165/build/three.module.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.165/examples/jsm/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f1115);

const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

camera.position.set(5,5,8);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

const grid = new THREE.GridHelper(50, 50, 0x888888, 0x444444);
scene.add(grid);

const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 2);
dirLight.position.set(5,10,7);
scene.add(dirLight);

const objects = [];
let selectedObject = null;

function createMaterial(){
  return new THREE.MeshStandardMaterial({
    color:0x1f6fff,
    metalness:0.3,
    roughness:0.4
  });
}

window.addCube = function(){
  const geo = new THREE.BoxGeometry(1,1,1);
  const mesh = new THREE.Mesh(geo, createMaterial());
  mesh.position.set(Math.random()*4-2, 0.5, Math.random()*4-2);
  scene.add(mesh);
  objects.push(mesh);
}

window.addSphere = function(){
  const geo = new THREE.SphereGeometry(0.7, 32, 32);
  const mesh = new THREE.Mesh(geo, createMaterial());
  mesh.position.set(Math.random()*4-2, 0.7, Math.random()*4-2);
  scene.add(mesh);
  objects.push(mesh);
}

window.addCylinder = function(){
  const geo = new THREE.CylinderGeometry(0.5,0.5,1.5,32);
  const mesh = new THREE.Mesh(geo, createMaterial());
  mesh.position.set(Math.random()*4-2, 0.8, Math.random()*4-2);
  scene.add(mesh);
  objects.push(mesh);
}

window.deleteSelected = function(){
  if(selectedObject){
    scene.remove(selectedObject);
    const index = objects.indexOf(selectedObject);
    if(index > -1) objects.splice(index,1);
    selectedObject = null;
  }
}

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

window.addEventListener('click', (event)=>{
  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(objects);

  if(intersects.length > 0){
    if(selectedObject){
      selectedObject.material.color.set(0x1f6fff);
    }

    selectedObject = intersects[0].object;
    selectedObject.material.color.set(0xffaa00);

    document.getElementById('scaleSlider').value = selectedObject.scale.x;
    document.getElementById('rotateSlider').value = THREE.MathUtils.radToDeg(selectedObject.rotation.y);
  }
});

const scaleSlider = document.getElementById('scaleSlider');
scaleSlider.addEventListener('input', ()=>{
  if(selectedObject){
    const s = parseFloat(scaleSlider.value);
    selectedObject.scale.set(s,s,s);
  }
});

const rotateSlider = document.getElementById('rotateSlider');
rotateSlider.addEventListener('input', ()=>{
  if(selectedObject){
    selectedObject.rotation.y = THREE.MathUtils.degToRad(parseFloat(rotateSlider.value));
  }
});

window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

animate();

addCube();
addSphere();
</script></body>
</html>
