<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CINÉMA — Video Player</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #000000;
    --accent: #e8c87a; /* カームゴールド */
    --text: rgba(255,255,255,0.9);
    --border: rgba(255,255,255,0.2);
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    overflow: hidden;
  }

  .app {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  /* ─── HEADER ─── */
  header {
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 20;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    padding: max(16px, env(safe-area-inset-top)) 20px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
    opacity: 0;
    transition: opacity 0.4s ease;
  }

  .clock-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 24px;
    letter-spacing: 0.1em;
    color: #fff;
  }

  .header-btns {
    display: flex;
    gap: 12px;
  }

  /* ─── BUTTONS ─── */
  .icon-btn {
    background: rgba(0,0,0,0.4);
    border: 1px solid var(--border);
    border-radius: 50%;
    width: 44px;
    height: 44px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
  }
  .icon-btn:active { transform: scale(0.9); }
  .icon-btn svg { stroke: var(--accent); }
  .icon-btn.active { border-color: var(--accent); background: rgba(232,200,122,0.1); }

  /* ─── CONTROLS ─── */
  .controls {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    z-index: 20;
    padding: 20px 20px max(24px, env(safe-area-inset-bottom));
    background: linear-gradient(to top, rgba(0,0,0,0.6), transparent);
    opacity: 0;
    transition: opacity 0.4s ease;
  }

  .app.ui-visible header,
  .app.ui-visible .controls { opacity: 1; }

  .seekbar-row {
    display: flex;
    align-items: center;
    gap: 15px;
  }

  input[type=range] {
    -webkit-appearance: none;
    flex-grow: 1;
    height: 2px;
    background: rgba(255,255,255,0.2);
    outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
  }

  .time-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--accent);
    min-width: 100px;
    text-align: right;
  }

  /* ─── PLAY BUTTON ─── */
  .play-toggle {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 72px; height: 72px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
    display: flex; align-items: center; justify-content: center;
    opacity: 0;
    transition: opacity 0.3s;
    z-index: 25;
    box-shadow: 0 0 20px rgba(232,200,122,0.3);
  }
  .app.ui-visible .play-toggle { opacity: 1; }
  
  .play-icon, .pause-icon { position: absolute; }
  .playing .play-icon { display: none; }
  .paused .pause-icon { display: none; }

  #fileInput { display: none; }

</style>
</head>
<body>

<div class="app ui-visible" id="app">
  <video id="video"></video>
  
  <header>
    <div class="clock"><span class="clock-time" id="clockTime">00:00:00</span></div>
    <div class="header-btns">
      <button class="icon-btn" id="btnBlur">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
      </button>
      <button class="icon-btn" id="openBtn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg>
      </button>
      <button class="icon-btn" id="btnVoice">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>
      </button>
    </div>
  </header>

  <button class="play-toggle paused" id="playBtn">
    <div class="play-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="#000"><polygon points="5 3 19 12 5 21 5 3"/></svg></div>
    <div class="pause-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="#000"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg></div>
  </button>

  <div class="controls">
    <div class="seekbar-row">
      <input type="range" id="seek" value="0">
      <div class="time-label" id="timeLabel">00:00 / 00:00</div>
    </div>
  </div>

  <input type="file" id="fileInput" accept="video/*">
</div>

<script>
  const video = document.getElementById('video');
  const app = document.getElementById('app');
  const clockTime = document.getElementById('clockTime');
  const playBtn = document.getElementById('playBtn');
  const fileInput = document.getElementById('fileInput');

  // 時計の更新 (00:00:00 形式)
  function updateClock() {
    const now = new Date();
    clockTime.textContent = now.toTimeString().split(' ')[0];
  }
  setInterval(updateClock, 1000);
  updateClock();

  // UI表示制御
  let uiTimer;
  function showUI() {
    app.classList.add('ui-visible');
    clearTimeout(uiTimer);
    uiTimer = setTimeout(() => app.classList.remove('ui-visible'), 3000);
  }
  app.addEventListener('mousemove', showUI);
  app.addEventListener('click', showUI);

  // ファイル読み込み
  document.getElementById('openBtn').addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', e => {
    const file = e.target.files[0];
    if (file) {
      video.src = URL.createObjectURL(file);
      video.play();
      playBtn.className = 'play-toggle playing';
    }
  });

  // 再生・停止
  playBtn.addEventListener('click', () => {
    if (video.paused) {
      video.play();
      playBtn.className = 'play-toggle playing';
    } else {
      video.pause();
      playBtn.className = 'play-toggle paused';
    }
  });
</script>
</body>
</html>
