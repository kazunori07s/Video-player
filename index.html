<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CINÉMA — Video Player</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #000000;
    --accent: #e8c87a; /* カームゴールド */
    --danger: #ff4f4f;
    --text: rgba(255,255,255,0.9);
    --border: rgba(255,255,255,0.25);
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    overflow: hidden;
  }

  .app {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background: #000;
  }

  video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  /* ─── OVERLAYS ─── */
  .blur-overlay {
    position: absolute;
    inset: 0;
    background: #000;
    z-index: 15;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  .blur-overlay.active { opacity: 1; pointer-events: auto; }

  .toast {
    position: absolute;
    top: 20%; left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.8);
    border: 1px solid var(--accent);
    padding: 8px 18px;
    border-radius: 24px;
    font-size: 14px;
    font-family: 'JetBrains Mono', monospace;
    z-index: 100;
    opacity: 0;
    transition: opacity 0.3s, transform 0.3s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translate(-50%, -5px); }

  /* ─── HEADER ─── */
  header {
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: max(16px, env(safe-area-inset-top)) 20px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
    opacity: 0;
    transition: opacity 0.4s ease;
  }

  .clock-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    letter-spacing: 0.05em;
    color: #fff;
  }

  .header-btns {
    display: flex;
    gap: 12px;
  }

  .icon-btn {
    background: rgba(0,0,0,0.5);
    border: 1.5px solid var(--border);
    border-radius: 50%;
    width: 48px;
    height: 48px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
  }
  .icon-btn:active { transform: scale(0.9); }
  .icon-btn svg { stroke: var(--accent); fill: none; }
  
  .icon-btn.active { border-color: var(--accent); background: rgba(232,200,122,0.15); }
  .icon-btn.danger { border-color: var(--danger); }
  .icon-btn.listening { animation: pulse 1.5s infinite; border-color: var(--danger); }

  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(255, 79, 79, 0.4); }
    70% { box-shadow: 0 0 0 10px rgba(255, 79, 79, 0); }
    100% { box-shadow: 0 0 0 0 rgba(255, 79, 79, 0); }
  }

  /* ─── PLAY BUTTON ─── */
  .play-toggle {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 72px; height: 72px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
    display: flex; align-items: center; justify-content: center;
    opacity: 0;
    transition: opacity 0.3s, transform 0.2s;
    z-index: 25;
    box-shadow: 0 0 30px rgba(232,200,122,0.3);
    cursor: pointer;
  }
  .play-toggle:active { transform: translate(-50%, -50%) scale(0.9); }
  
  .play-icon, .pause-icon { position: absolute; }
  .playing .play-icon { display: none; }
  .paused .pause-icon { display: none; }

  /* ─── CONTROLS ─── */
  .controls {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    z-index: 20;
    padding: 20px 20px max(24px, env(safe-area-inset-bottom));
    background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
    opacity: 0;
    transition: opacity 0.4s ease;
  }

  .app.ui-visible header,
  .app.ui-visible .controls,
  .app.ui-visible .play-toggle { opacity: 1; }

  .seekbar-row {
    display: flex;
    align-items: center;
    gap: 15px;
  }

  input[type=range] {
    -webkit-appearance: none;
    flex-grow: 1;
    height: 2px;
    background: rgba(255,255,255,0.2);
    outline: none;
    cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px rgba(232,200,122,0.5);
  }

  .time-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--accent);
    min-width: 100px;
    text-align: right;
  }

  #fileInput { display: none; }
</style>
</head>
<body>

<div class="app ui-visible" id="app">
  <video id="video" playsinline></video>
  <div class="blur-overlay" id="blurOverlay"></div>
  <div class="toast" id="toast"></div>
  
  <header>
    <div class="clock"><span class="clock-time" id="clockTime">00:00:00</span></div>
    <div class="header-btns">
      <button class="icon-btn" id="btnBlur">
        <svg width="26" height="26" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>
        </svg>
      </button>
      <button class="icon-btn" id="openBtn">
        <svg width="26" height="26" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/>
        </svg>
      </button>
      <button class="icon-btn" id="btnVoice">
        <svg width="26" height="26" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>
      </button>
    </div>
  </header>

  <button class="play-toggle paused" id="playBtn">
    <div class="play-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="#000"><polygon points="5 3 19 12 5 21 5 3"/></svg></div>
    <div class="pause-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="#000"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg></div>
  </button>

  <div class="controls">
    <div class="seekbar-row">
      <input type="range" id="seek" min="0" max="100" value="0" step="0.1">
      <div class="time-label" id="timeLabel">00:00 / 00:00</div>
    </div>
  </div>

  <input type="file" id="fileInput" accept="video/*">
</div>

<script>
  const video = document.getElementById('video');
  const app = document.getElementById('app');
  const clockTime = document.getElementById('clockTime');
  const playBtn = document.getElementById('playBtn');
  const seek = document.getElementById('seek');
  const timeLabel = document.getElementById('timeLabel');
  const btnBlur = document.getElementById('btnBlur');
  const blurOverlay = document.getElementById('blurOverlay');
  const openBtn = document.getElementById('openBtn');
  const fileInput = document.getElementById('fileInput');
  const btnVoice = document.getElementById('btnVoice');
  const toast = document.getElementById('toast');

  // --- 1. 時計 (HH:MM:SS) ---
  function updateClock() {
    const now = new Date();
    clockTime.textContent = now.toTimeString().split(' ')[0];
  }
  setInterval(updateClock, 1000);
  updateClock();

  // --- 2. 再生/一時停止 ---
  function togglePlay() {
    if (video.paused) {
      video.play();
      playBtn.className = 'play-toggle playing';
    } else {
      video.pause();
      playBtn.className = 'play-toggle paused';
    }
  }
  playBtn.addEventListener('click', togglePlay);

  // --- 3. シークバー連動 ---
  function formatTime(s) {
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60);
    return `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
  }

  video.addEventListener('timeupdate', () => {
    if (!video.duration) return;
    const progress = (video.currentTime / video.duration) * 100;
    seek.value = progress;
    timeLabel.textContent = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
  });

  seek.addEventListener('input', () => {
    if (!video.duration) return;
    video.currentTime = (seek.value / 100) * video.duration;
  });

  video.addEventListener('loadedmetadata', () => {
    timeLabel.textContent = `00:00 / ${formatTime(video.duration)}`;
  });

  // --- 4. フォルダ (ファイル読み込み) ---
  openBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', e => {
    const file = e.target.files[0];
    if (file) {
      video.src = URL.createObjectURL(file);
      video.play();
      playBtn.className = 'play-toggle playing';
      showToast("VIDEO LOADED");
    }
  });

  // --- 5. ぼかしモード (ブラックアウト) ---
  let isBlurred = false;
  btnBlur.addEventListener('click', () => {
    isBlurred = !isBlurred;
    blurOverlay.classList.toggle('active', isBlurred);
    btnBlur.classList.toggle('active', isBlurred);
    btnBlur.classList.toggle('danger', isBlurred);
    if (isBlurred) {
      video.pause();
      playBtn.className = 'play-toggle paused';
      showToast("LOCKED");
    } else {
      showToast("UNLOCKED");
    }
  });

  // --- 6. 音声認識 (簡易コマンド) ---
  let recognition;
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
  }

  if ('webkitSpeechRecognition' in window) {
    recognition = new webkitSpeechRecognition();
    recognition.lang = 'ja-JP';
    recognition.onresult = (e) => {
      const cmd = e.results[0][0].transcript;
      showToast(`CMD: ${cmd}`);
      if (cmd.includes("再生")) video.play();
      if (cmd.includes("停止") || cmd.includes("止めて")) video.pause();
    };
    recognition.onend = () => btnVoice.classList.remove('listening');
  }

  btnVoice.addEventListener('click', () => {
    if (!recognition) return showToast("NOT SUPPORTED");
    recognition.start();
    btnVoice.classList.add('listening');
    showToast("LISTENING...");
  });

  // --- 7. UI 自動非表示 ---
  let uiTimer;
  function showUI() {
    app.classList.add('ui-visible');
    clearTimeout(uiTimer);
    uiTimer = setTimeout(() => {
      if (!video.paused && !isBlurred) app.classList.remove('ui-visible');
    }, 4000);
  }
  app.addEventListener('mousemove', showUI);
  app.addEventListener('touchstart', showUI);
  showUI();

</script>
</body>
</html>
