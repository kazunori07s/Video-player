<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CINÉMA — Video Player</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #080a0d; --surface: #0f1318; --panel: #151a21;
    --border: rgba(255,255,255,0.06); --accent: #e8c87a; --accent2: #5b8fff;
    --danger: #ff4f4f; --muted: rgba(255,255,255,0.28);
    --text: rgba(255,255,255,0.88); --radius: 12px;
  }
  html, body { height: 100%; background: #000; color: var(--text); font-family: 'DM Sans', sans-serif; font-weight: 300; overflow: hidden; }
  .app { position: fixed; inset: 0; width: 100%; height: 100%; background: #000; }
  video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
  .blur-overlay { position: absolute; inset: 0; background: #000; z-index: 10; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
  .blur-overlay.active { opacity: 1; pointer-events: auto; }
  header {
    position: absolute; top: 0; left: 0; right: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: max(12px, env(safe-area-inset-top)) 14px 12px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.75) 0%, transparent 100%);
    opacity: 0; transition: opacity 0.4s ease; pointer-events: none;
  }
  .header-btns { display: flex; align-items: center; gap: 8px; }
  .controls {
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 20;
    padding: 20px 14px max(16px, env(safe-area-inset-bottom));
    background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 100%);
    display: flex; flex-direction: column; gap: 10px;
    opacity: 0; transition: opacity 0.4s ease; pointer-events: none;
  }
  .app.ui-visible header, .app.ui-visible .controls { opacity: 1; pointer-events: auto; }
  .seekbar-row { display: flex; align-items: center; gap: 10px; }
  .time-label { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted); min-width: 82px; letter-spacing: 0.02em; white-space: nowrap; text-align: right; }
  input[type=range] { -webkit-appearance: none; width: 100%; height: 3px; border-radius: 2px; background: rgba(255,255,255,0.1); outline: none; cursor: pointer; transition: height 0.15s; }
  input[type=range]:hover { height: 5px; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%; background: var(--accent); cursor: pointer; box-shadow: 0 0 8px rgba(232,200,122,0.5); transition: transform 0.15s; }
  input[type=range]:hover::-webkit-slider-thumb { transform: scale(1.2); }
  #seek { --p: 0%; background: linear-gradient(to right, var(--accent) var(--p), rgba(255,255,255,0.1) var(--p)); }
  .play-toggle {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 20;
    width: 64px; height: 64px; border-radius: 50%; background: var(--accent); border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 32px rgba(232,200,122,0.35); transition: opacity 0.4s ease, box-shadow 0.15s;
    opacity: 0; pointer-events: none;
  }
  .app.ui-visible .play-toggle { opacity: 1; pointer-events: auto; }
  .play-toggle:active { box-shadow: 0 0 48px rgba(232,200,122,0.5); }
  .play-icon, .pause-icon { position: absolute; transition: opacity 0.2s, transform 0.2s; }
  .play-icon svg, .pause-icon svg { display: block; }
  .play-toggle.paused .play-icon  { opacity: 1; transform: translateX(1px); }
  .play-toggle.paused .pause-icon { opacity: 0; transform: scale(0.7); }
  .play-toggle.playing .play-icon  { opacity: 0; transform: scale(0.7); }
  .play-toggle.playing .pause-icon { opacity: 1; transform: none; }
  .icon-btn {
    background: rgba(0,0,0,0.55); border: 1.5px solid rgba(255,255,255,0.25); border-radius: 50%;
    width: 48px; height: 48px; cursor: pointer; font-size: 22px; line-height: 1; color: var(--text);
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
    user-select: none; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  .icon-btn:active { transform: scale(0.92); }
  .icon-btn.active { background: rgba(232,200,122,0.2); border-color: var(--accent); }
  .icon-btn.active.danger { background: rgba(255,79,79,0.2); border-color: var(--danger); }
  .open-btn {
    background: rgba(0,0,0,0.55); border: 1.5px solid rgba(255,255,255,0.25); border-radius: 50%;
    width: 48px; height: 48px; cursor: pointer; font-size: 22px; line-height: 1; color: var(--text);
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
    user-select: none; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  .open-btn:active { transform: scale(0.92); }
  #fileInput { display: none; }
  .toast {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 30;
    background: rgba(0,0,0,0.75); border: 1px solid rgba(255,255,255,0.15); border-radius: 12px;
    padding: 10px 20px; font-size: 15px; color: #fff; letter-spacing: 0.04em;
    pointer-events: none; opacity: 0; transition: opacity 0.25s ease; white-space: nowrap;
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  }
  .toast.show { opacity: 1; }
  .icon-btn.listening { background: rgba(255,60,60,0.25); border-color: #ff4f4f; animation: voicePulse 1s ease-in-out infinite; }
  @keyframes voicePulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,79,79,0.4); } 50% { box-shadow: 0 0 0 10px rgba(255,79,79,0); } }
  /* ── CLOCK ── */
  .clock { display: flex; flex-direction: column; line-height: 1.3; }
  .clock-time { font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 400; color: #ffffff; letter-spacing: 0.03em; }
</style>
</head>
<body>
<div class="app" id="app">
  <video id="video" preload="auto"></video>
  <div class="blur-overlay" id="blurOverlay"></div>
  <div class="toast" id="toast"></div>

  <header>
    <div class="clock">
      <span class="clock-time" id="clockTime">--時--分--秒</span>
    </div>
    <div class="header-btns">
      <button class="icon-btn" id="btnBlur" title="ぼかしモード切替 (B)">🔓</button>
      <button class="open-btn" id="openBtn">📂</button>
      <button class="icon-btn" id="btnVoice" title="音声コントロール">🎤</button>
      <input type="file" id="fileInput" accept="video/*">
    </div>
  </header>

  <button class="play-toggle paused" id="playBtn" title="再生/一時停止 (Space)">
    <span class="play-icon">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="#080a0d"><polygon points="4,2 13,8 4,14"/></svg>
    </span>
    <span class="pause-icon">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="#080a0d">
        <rect x="2" y="1" width="4" height="12" rx="1.5"/><rect x="8" y="1" width="4" height="12" rx="1.5"/>
      </svg>
    </span>
  </button>

  <div class="controls">
    <div class="seekbar-row">
      <input type="range" id="seek" min="0" max="100" value="0" step="0.01">
      <div class="time-label" id="timeLabel">0:00 / 0:00</div>
    </div>
  </div>
</div>

<script>
  const video       = document.getElementById('video');
  const playBtn     = document.getElementById('playBtn');
  const seek        = document.getElementById('seek');
  const timeLabel   = document.getElementById('timeLabel');
  const blurOverlay = document.getElementById('blurOverlay');
  const fileInput   = document.getElementById('fileInput');
  const openBtn     = document.getElementById('openBtn');
  const btnBlur     = document.getElementById('btnBlur');
  const app         = document.getElementById('app');
  const clockTime   = document.getElementById('clockTime');

  let blurOn = false;
  let pausedByMode = false;
  let uiTimer = null;

  // ── 時計 ──
  function updateClock() {
    const now = new Date();
    const hh  = String(now.getHours()).padStart(2, '0');
    const mm  = String(now.getMinutes()).padStart(2, '0');
    const ss  = String(now.getSeconds()).padStart(2, '0');
    clockTime.textContent = hh + '時' + mm + '分' + ss + '秒';
  }
  updateClock();
  setInterval(updateClock, 1000);

  // ── UI表示 ──
  function showUI() {
    app.classList.add('ui-visible');
    clearTimeout(uiTimer);
    uiTimer = setTimeout(() => app.classList.remove('ui-visible'), 5000);
  }
  app.addEventListener('click', showUI);
  app.addEventListener('touchstart', showUI, { passive: true });
  document.querySelectorAll('input[type=range], button').forEach(el => {
    el.addEventListener('pointerdown', showUI);
  });
  showUI();

  // ── FILE LOADING ──
  function loadFile(file) {
    if (!file || !file.type.startsWith('video/')) return;
    const url = URL.createObjectURL(file);
    video.src = url;
    video.load();
    updatePlayBtn();
  }
  openBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', e => loadFile(e.target.files[0]));

  // ── PLAY / PAUSE ──
  function updatePlayBtn() {
    const playing = !video.paused && !video.ended;
    playBtn.classList.toggle('playing', playing);
    playBtn.classList.toggle('paused', !playing);
  }
  playBtn.addEventListener('click', togglePlay);
  function togglePlay() {
    if (!video.src) return;
    if (video.paused || video.ended) video.play();
    else video.pause();
  }
  video.addEventListener('play',  updatePlayBtn);
  video.addEventListener('pause', updatePlayBtn);
  video.addEventListener('ended', updatePlayBtn);

  // ── SEEK ──
  video.addEventListener('timeupdate', () => {
    if (!video.duration) return;
    const pct = (video.currentTime / video.duration) * 100;
    seek.value = pct;
    seek.style.setProperty('--p', pct + '%');
    timeLabel.textContent = fmtTime(video.currentTime) + ' / ' + fmtTime(video.duration);
  });
  seek.addEventListener('input', () => {
    if (!video.duration) return;
    video.currentTime = (seek.value / 100) * video.duration;
    seek.style.setProperty('--p', seek.value + '%');
  });
  function fmtTime(s) {
    const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = Math.floor(s%60);
    if (h > 0) return h + ':' + String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
    return m + ':' + String(sec).padStart(2,'0');
  }

  // ── BLUR MODE ──
  function applyBlur(on) {
    blurOn = on;
    btnBlur.className = 'icon-btn' + (on ? ' active danger' : '');
    btnBlur.textContent = on ? '🔒' : '🔓';
    blurOverlay.classList.toggle('active', on);
    if (on) {
      if (!video.paused) { video.pause(); pausedByMode = true; }
    } else {
      if (pausedByMode) { video.play().catch(()=>{}); pausedByMode = false; }
    }
    video.muted = on;
  }
  btnBlur.addEventListener('click', () => applyBlur(!blurOn));

  // ── VOICE ──
  const btnVoice = document.getElementById('btnVoice');
  const toast    = document.getElementById('toast');
  let recognition = null;
  let isListening = false;
  let toastTimer  = null;

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
  }
  function parseSeconds(text) {
    let total = 0;
    const min = text.match(/(\d+)\s*分/);
    const sec = text.match(/(\d+)\s*秒/);
    if (min) total += parseInt(min[1]) * 60;
    if (sec) total += parseInt(sec[1]);
    return total || 10;
  }
  function handleCommand(text) {
    text = text.replace(/\s/g, '');
    showUI();
    if (/再生|プレイ|play/i.test(text)) { video.play().catch(()=>{}); showToast('▶ 再生'); }
    else if (/止|停止|ポーズ|pause/i.test(text)) { video.pause(); showToast('⏸ 一時停止'); }
    else if (/戻|巻き戻|rewind|back/i.test(text)) { const s = parseSeconds(text); video.currentTime = Math.max(0, video.currentTime - s); showToast('⏪ ' + s + '秒戻しました'); }
    else if (/進|スキップ|飛ば|forward|skip/i.test(text)) { const s = parseSeconds(text); video.currentTime = Math.min(video.duration||0, video.currentTime + s); showToast('⏩ ' + s + '秒進みました'); }
    else if (/最初|はじめ|先頭|restart/i.test(text)) { video.currentTime = 0; showToast('⏮ 最初から'); }
    else if (/最後|終わり|end/i.test(text)) { video.currentTime = video.duration || 0; showToast('⏭ 最後へ'); }
    else if (/ぼかし|隠|lock/i.test(text) && /オン|on|入|つけ/i.test(text)) { applyBlur(true); showToast('🔒 ぼかし ON'); }
    else if (/ぼかし|隠|unlock/i.test(text) && /オフ|off|切|消/i.test(text)) { applyBlur(false); showToast('🔓 ぼかし OFF'); }
    else { showToast('「' + text + '」— 認識できませんでした'); }
  }
  function setupRecognition() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { showToast('このブラウザは音声認識非対応です'); return null; }
    const r = new SR();
    r.lang = 'ja-JP'; r.continuous = false; r.interimResults = false;
    r.onresult = e => handleCommand(e.results[0][0].transcript);
    r.onend = () => {
      if (isListening) { try { r.start(); } catch(_) {} }
      else { btnVoice.classList.remove('listening'); btnVoice.textContent = '🎤'; }
    };
    r.onerror = e => {
      if (e.error === 'no-speech' || e.error === 'aborted') return;
      showToast('音声認識エラー: ' + e.error);
      isListening = false; btnVoice.classList.remove('listening'); btnVoice.textContent = '🎤';
    };
    return r;
  }
  btnVoice.addEventListener('click', () => {
    showUI();
    if (isListening) {
      isListening = false; recognition && recognition.stop();
      btnVoice.classList.remove('listening'); btnVoice.textContent = '🎤';
      showToast('🎤 音声認識 OFF'); return;
    }
    recognition = setupRecognition();
    if (!recognition) return;
    isListening = true; btnVoice.classList.add('listening'); btnVoice.textContent = '🔴';
    showToast('🎤 音声認識 ON');
    recognition.start();
  });

  // ── KEYBOARD ──
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    switch(e.code) {
      case 'Space': e.preventDefault(); togglePlay(); break;
      case 'KeyB': btnBlur.click(); break;
      case 'ArrowLeft': e.preventDefault(); video.currentTime = Math.max(0, video.currentTime - 10); break;
      case 'ArrowRight': e.preventDefault(); video.currentTime = Math.min(video.duration||0, video.currentTime + 10); break;
    }
  });
</script>
</body>
</html>
