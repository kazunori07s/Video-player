<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CINÉMA — Video Player</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #080a0d;
    --surface: #0f1318;
    --panel: #151a21;
    --border: rgba(255,255,255,0.06);
    --accent: #e8c87a;
    --accent2: #5b8fff;
    --danger: #ff4f4f;
    --muted: rgba(255,255,255,0.28);
    --text: rgba(255,255,255,0.88);
    --radius: 12px;
  }

  html, body {
    height: 100%;
    background: #000;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    overflow: hidden;
  }

  /* ─── LAYOUT ─── */
  .app {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background: #000;
  }

  /* ─── VIDEO FULLSCREEN ─── */
  video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  /* ─── BLUR OVERLAY ─── */
  .blur-overlay {
    position: absolute;
    inset: 0;
    background: #000;
    z-index: 10;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  .blur-overlay.active { opacity: 1; pointer-events: auto; }

  /* ─── HEADER (overlay top) ─── */
  header {
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: max(12px, env(safe-area-inset-top)) 14px 12px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, transparent 100%);
    opacity: 1;
    transition: opacity 0.4s ease;
    pointer-events: auto;
  }

  /* ─── CLOCK ─── */
  .clock {
    display: flex;
    flex-direction: column;
    line-height: 1.2;
  }
  .clock-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    font-weight: 400;
    color: #ffffff;
    letter-spacing: 0.05em;
  }

  .header-btns {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* ─── CONTROLS (overlay bottom) ─── */
  .controls {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    z-index: 20;
    padding: 20px 14px max(16px, env(safe-area-inset-bottom));
    background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 100%);
    display: flex;
    flex-direction: column;
    gap: 10px;
    opacity: 0;
    transition: opacity 0.4s ease;
    pointer-events: none;
  }

  /* ─── UI VISIBLE STATE ─── */
  .app.ui-visible header,
  .app.ui-visible .controls {
    opacity: 1;
    pointer-events: auto;
  }

  /* ── SEEKBAR ── */
  .seekbar-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .time-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    min-width: 82px;
    letter-spacing: 0.02em;
    white-space: nowrap;
    text-align: right;
  }
  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    height: 3px;
    border-radius: 2px;
    background: rgba(255,255,255,0.1);
    outline: none;
    cursor: pointer;
    transition: height 0.15s;
  }
  input[type=range]:hover { height: 5px; }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 13px; height: 13px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    box-shadow: 0 0 8px rgba(232,200,122,0.5);
    transition: transform 0.15s;
  }
  input[type=range]:hover::-webkit-slider-thumb { transform: scale(1.2); }
  #seek { --p: 0%; background: linear-gradient(to right, var(--accent) var(--p), rgba(255,255,255,0.1) var(--p)); }

  /* ── BUTTON ROW ── */
  .btn-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  /* ── PLAY TOGGLE ── */
  .play-toggle {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 20;
    width: 64px; height: 64px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 32px rgba(232,200,122,0.35);
    transition: opacity 0.4s ease, box-shadow 0.15s;
    opacity: 0;
    pointer-events: none;
  }
  .app.ui-visible .play-toggle {
    opacity: 1;
    pointer-events: auto;
  }
  .play-toggle:active { box-shadow: 0 0 48px rgba(232,200,122,0.5); }
  .play-icon, .pause-icon {
    position: absolute;
    transition: opacity 0.2s, transform 0.2s;
  }
  .play-icon svg, .pause-icon svg { display: block; }
  /* state: paused → show play */
  .play-toggle.paused .play-icon  { opacity: 1; transform: translateX(1px); }
  .play-toggle.paused .pause-icon { opacity: 0; transform: scale(0.7); }
  /* state: playing → show pause */
  .play-toggle.playing .play-icon  { opacity: 0; transform: scale(0.7); }
  .play-toggle.playing .pause-icon { opacity: 1; transform: none; }

  .icon-btn {
    background: rgba(0,0,0,0.55);
    border: 1.5px solid rgba(255,255,255,0.25);
    border-radius: 50%;
    width: 48px;
    height: 48px;
    cursor: pointer;
    font-size: 22px;
    line-height: 1;
    color: var(--text);
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
    user-select: none;
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
  }
  .icon-btn:active { transform: scale(0.92); }
  .icon-btn.active {
    background: rgba(232,200,122,0.2);
    border-color: #ffffff;
  }
  .icon-btn.active.danger {
    background: rgba(255,79,79,0.2);
    border-color: var(--danger);
  }

  .open-btn {
    background: rgba(0,0,0,0.55);
    border: 1.5px solid rgba(255,255,255,0.25);
    border-radius: 50%;
    width: 48px;
    height: 48px;
    cursor: pointer;
    font-size: 22px;
    line-height: 1;
    color: var(--text);
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
    user-select: none;
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
  }
  .open-btn:active { transform: scale(0.92); }



  /* ─── HIDDEN FILE INPUT ─── */
  #fileInput { display: none; }

  /* ─── TOAST ─── */
  .toast {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 30;
    background: rgba(0,0,0,0.75);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 12px;
    padding: 10px 20px;
    font-size: 15px;
    color: #fff;
    letter-spacing: 0.04em;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.25s ease;
    white-space: nowrap;
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
  }
  .toast.show { opacity: 1; }

  /* ─── VOICE LISTENING RING ─── */
  .icon-btn.listening {
    background: rgba(255,60,60,0.25);
    border-color: #ff4f4f;
    animation: voicePulse 1s ease-in-out infinite;
  }
  @keyframes voicePulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(255,79,79,0.4); }
    50%      { box-shadow: 0 0 0 10px rgba(255,79,79,0); }
  }

  /* ─── KEYBOARD HINT ─── */
  .hint {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: rgba(255,255,255,0.14);
    letter-spacing: 0.04em;
    text-align: center;
  }
  .hint kbd {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 3px;
    padding: 1px 5px;
    font-size: 10px;
    font-family: inherit;
  }

  /* ── HELP MODAL ── */
  .help-btn {
    background: rgba(0,0,0,0.55); border: 1.5px solid rgba(255,255,255,0.25); border-radius: 50%;
    width: 48px; height: 48px; cursor: pointer; font-size: 22px; color: var(--text);
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, transform 0.1s;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  .help-btn:active { transform: scale(0.92); }
  .modal-overlay {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(0,0,0,0.75); display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 0.25s;
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
  }
  .modal-overlay.show { opacity: 1; pointer-events: auto; }
  .modal {
    background: #151a21; border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px; padding: 24px 20px; width: min(320px, 90vw);
    transform: translateY(12px); transition: transform 0.25s;
  }
  .modal-overlay.show .modal { transform: translateY(0); }
  .modal-title {
    font-size: 13px; font-weight: 500; letter-spacing: 0.1em;
    color: var(--accent); text-transform: uppercase; margin-bottom: 16px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .modal-close {
    background: none; border: none; color: var(--muted); font-size: 20px;
    cursor: pointer; padding: 0 4px; line-height: 1;
  }
  .modal-section { margin-bottom: 16px; }
  .modal-section-title {
    font-size: 11px; color: var(--muted); letter-spacing: 0.08em;
    text-transform: uppercase; margin-bottom: 8px; padding-bottom: 4px;
    border-bottom: 1px solid rgba(255,255,255,0.07);
  }
  .cmd-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .cmd-row:last-child { border-bottom: none; }
  .cmd-word {
    font-family: 'JetBrains Mono', monospace; font-size: 13px;
    color: var(--accent); background: rgba(232,200,122,0.1);
    padding: 2px 8px; border-radius: 6px;
  }
  .cmd-desc { font-size: 12px; color: var(--muted); text-align: right; }
</style>
</head>
<body>

<div class="app" id="app">
  <!-- VIDEO -->
  <video id="video" preload="auto"></video>

  <!-- BLUR OVERLAY -->
  <div class="blur-overlay" id="blurOverlay"></div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <!-- HEADER -->
  <header>
    <!-- 現在時刻 -->
    <div class="clock" id="clock">
      <span class="clock-time" id="clockTime">--:--:--</span>
    <script>
      (function() {
        function tick() {
          var now = new Date();
          var hh  = String(now.getHours()).padStart(2,'0');
          var mm  = String(now.getMinutes()).padStart(2,'0');
          var ss  = String(now.getSeconds()).padStart(2,'0');
          var el  = document.getElementById('clockTime');
          if (el) el.textContent = hh + '時' + mm + '分' + ss + '秒';
        }
        tick();
        setInterval(tick, 1000);
      })();
    
  // ── HELP MODAL ──
  const helpOverlay = document.getElementById('helpOverlay');
  const btnHelp     = document.getElementById('btnHelp');
  const helpClose   = document.getElementById('helpClose');

  btnHelp.addEventListener('click', () => {
    helpOverlay.classList.add('show');
  });
  helpClose.addEventListener('click', () => {
    helpOverlay.classList.remove('show');
  });
  helpOverlay.addEventListener('click', (e) => {
    if (e.target === helpOverlay) helpOverlay.classList.remove('show');
  });

</script>
    </div>
    <div class="header-btns">
      <button class="icon-btn" id="btnBlur" title="ぼかしモード切替 (B)"><span id="blurIcon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#e8c87a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
  <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
  <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
  <line x1="1" y1="1" x2="23" y2="23"/>
</svg></span></button>
      <button class="open-btn" id="openBtn"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#e8c87a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <path d="M3 7a2 2 0 0 1 2-2h3.17a2 2 0 0 1 1.42.59l1 1H19a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/>
  <line x1="12" y1="11" x2="12" y2="17"/>
  <line x1="9" y1="14" x2="15" y2="14"/>
</svg></button>
      <button class="icon-btn" id="btnVoice" title="音声コントロール">🎤</button>
      <button class="help-btn" id="btnHelp" title="音声コマンド一覧">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#e8c87a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
          <line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
      </button>
      <input type="file" id="fileInput" accept="video/*">
    </div>
  </header>

  <!-- Play Button (center) -->
  <button class="play-toggle paused" id="playBtn" title="再生/一時停止 (Space)">
    <span class="play-icon">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="#080a0d">
        <polygon points="4,2 13,8 4,14"/>
      </svg>
    </span>
    <span class="pause-icon">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="#080a0d">
        <rect x="2" y="1" width="4" height="12" rx="1.5"/>
        <rect x="8" y="1" width="4" height="12" rx="1.5"/>
      </svg>
    </span>
  </button>

  <!-- CONTROLS -->
  <div class="controls">
    <!-- Seekbar -->
    <div class="seekbar-row">
      <input type="range" id="seek" min="0" max="100" value="0" step="0.01">
      <div class="time-label" id="timeLabel">0:00 / 0:00</div>
    </div>
  </div>
</div>

<script>
  const video       = document.getElementById('video');
  const playBtn     = document.getElementById('playBtn');
  const seek        = document.getElementById('seek');
  const timeLabel   = document.getElementById('timeLabel');
  const blurOverlay = document.getElementById('blurOverlay');
  const fileInput   = document.getElementById('fileInput');
  const openBtn     = document.getElementById('openBtn');
  const btnBlur     = document.getElementById('btnBlur');
  const app         = document.getElementById('app');

  // ── STATE ──
  let blurOn = false;
  let pausedByMode = false;
  let uiTimer = null;


  // ═══════════════════════════════════
  // UI 表示／自動非表示
  // ═══════════════════════════════════
  function showUI() {
    app.classList.add('ui-visible');
    clearTimeout(uiTimer);
    uiTimer = setTimeout(() => app.classList.remove('ui-visible'), 5000);
  }
  // 画面タップで表示
  app.addEventListener('click', showUI);
  app.addEventListener('touchstart', showUI, { passive: true });
  // コントロール操作中はタイマーリセット
  document.querySelectorAll('input[type=range], button').forEach(el => {
    el.addEventListener('pointerdown', showUI);
  });

  // ═══════════════════════════════════
  // FILE LOADING
  // ═══════════════════════════════════
  function loadFile(file) {
    if (!file || !file.type.startsWith('video/')) return;
    const url = URL.createObjectURL(file);
    video.src = url;
    video.load();
    updatePlayBtn();
  }

  openBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', e => loadFile(e.target.files[0]));

  // ═══════════════════════════════════
  // PLAY / PAUSE TOGGLE
  // ═══════════════════════════════════
  function updatePlayBtn() {
    const playing = !video.paused && !video.ended;
    playBtn.classList.toggle('playing', playing);
    playBtn.classList.toggle('paused', !playing);
  }

  playBtn.addEventListener('click', togglePlay);

  function togglePlay() {
    if (!video.src) return;
    if (video.paused || video.ended) {
      video.play();
    } else {
      video.pause();
    }
  }

  video.addEventListener('play',  updatePlayBtn);
  video.addEventListener('pause', updatePlayBtn);
  video.addEventListener('ended', updatePlayBtn);

  // ═══════════════════════════════════
  // SEEK
  // ═══════════════════════════════════
  video.addEventListener('timeupdate', () => {
    if (!video.duration) return;
    const pct = (video.currentTime / video.duration) * 100;
    seek.value = pct;
    seek.style.setProperty('--p', pct + '%');
    timeLabel.textContent = `${fmtTime(video.currentTime)} / ${fmtTime(video.duration)}`;
  });

  seek.addEventListener('input', () => {
    if (!video.duration) return;
    video.currentTime = (seek.value / 100) * video.duration;
    seek.style.setProperty('--p', seek.value + '%');
  });

  function fmtTime(s) {
    const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = Math.floor(s%60);
    if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
    return `${m}:${String(sec).padStart(2,'0')}`;
  }

  // ═══════════════════════════════════
  // BLUR MODE — 1ボタンON/OFF: ブラックアウト+一時停止+ミュートを同時適用
  // ═══════════════════════════════════
  function applyBlur(on) {
    blurOn = on;
    // button
    btnBlur.className = 'icon-btn' + (on ? ' active danger' : '');
    document.getElementById('blurIcon').innerHTML = on ? "<svg width=\"28\" height=\"28\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#ff4f4f\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\">  <path d=\"M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z\"/>  <circle cx=\"12\" cy=\"12\" r=\"3\"/></svg>" : "<svg width=\"28\" height=\"28\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#e8c87a\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\">  <path d=\"M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94\"/>  <path d=\"M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19\"/>  <path d=\"M14.12 14.12a3 3 0 1 1-4.24-4.24\"/>  <line x1=\"1\" y1=\"1\" x2=\"23\" y2=\"23\"/></svg>";
    // blackout
    blurOverlay.classList.toggle('active', on);
    // pause
    if (on) {
      if (!video.paused) { video.pause(); pausedByMode = true; }
    } else {
      if (pausedByMode) { video.play().catch(()=>{}); pausedByMode = false; }
    }
      video.muted = on;
  }

  btnBlur.addEventListener('click', () => applyBlur(!blurOn));

  // ═══════════════════════════════════
  // VOICE COMMANDS
  // ═══════════════════════════════════
  const btnVoice = document.getElementById('btnVoice');
  const toast    = document.getElementById('toast');
  let recognition = null;
  let isListening = false;
  let toastTimer  = null;

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
  }

  function parseSeconds(text) {
    // 「30秒」「1分」「1分30秒」などを秒数に変換
    let total = 0;
    const min = text.match(/(\d+)\s*分/);
    const sec = text.match(/(\d+)\s*秒/);
    if (min) total += parseInt(min[1]) * 60;
    if (sec) total += parseInt(sec[1]);
    return total || 10; // デフォルト10秒
  }

  function handleCommand(text) {
    text = text.replace(/\s/g, '');
    showUI();

    // 再生
    if (/再生|プレイ|play/i.test(text)) {
      video.play().catch(()=>{});
      showToast('▶ 再生');
    }
    // 一時停止・停止
    else if (/止|停止|ポーズ|pause/i.test(text)) {
      video.pause();
      showToast('⏸ 一時停止');
    }
    // 巻き戻し・戻す
    else if (/戻|巻き戻|rewind|back/i.test(text)) {
      const s = parseSeconds(text);
      video.currentTime = Math.max(0, video.currentTime - s);
      showToast(`⏪ ${s}秒戻しました`);
    }
    // 早送り・進む
    else if (/進|スキップ|飛ば|forward|skip/i.test(text)) {
      const s = parseSeconds(text);
      video.currentTime = Math.min(video.duration||0, video.currentTime + s);
      showToast(`⏩ ${s}秒進みました`);
    }
    // 最初から
    else if (/最初|はじめ|先頭|restart/i.test(text)) {
      video.currentTime = 0;
      showToast('⏮ 最初から');
    }
    // 最後・終わり
    else if (/最後|終わり|end/i.test(text)) {
      video.currentTime = video.duration || 0;
      showToast('⏭ 最後へ');
    }
    // ぼかしトグル（「ぼかし」だけで ON/OFF 切替）
    else if (/ぼかし|隠せ|隠す|lock|unlock/i.test(text)) {
