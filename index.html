<script>

/* =========================
   要素取得（これ必須）
========================= */
const video = document.getElementById('video');
const micBtn = document.getElementById('micBtn');
const fileInput = document.getElementById('fileInput');
const app = document.getElementById('app');
const toast = document.getElementById('toast');

let uiTimer;

/* =========================
   音声認識チェック
========================= */
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if (!SpeechRecognition) {
  alert("この環境は音声認識に対応していません");
}

/* =========================
   初期設定
========================= */
const recognition = new SpeechRecognition();

recognition.lang = 'ja-JP';
recognition.continuous = true;
recognition.interimResults = false;

let recognizing = false;
let restarting = false;

/* =========================
   スタート（1回押すだけ）
========================= */
micBtn.onclick = () => {
  if (!recognizing) {
    try {
      recognition.start();
      recognizing = true;
      showToast("音声操作ON");
    } catch (e) {
      console.log("startエラー", e);
    }
  }
};

/* =========================
   安全な自動再起動
========================= */
recognition.onend = () => {
  if (recognizing && !restarting) {
    restarting = true;
    setTimeout(() => {
      try {
        recognition.start();
      } catch(e){}
      restarting = false;
    }, 500);
  }
};

/* =========================
   エラー処理
========================= */
recognition.onerror = (e) => {
  console.log("音声エラー:", e.error);

  if (e.error === "not-allowed") {
    showToast("マイク許可が必要");
    recognizing = false;
  }
};

/* =========================
   コマンド処理
========================= */
recognition.onresult = (e) => {

  const text = e.results[e.results.length - 1][0].transcript.trim();

  console.log("認識:", text);
  showUI();

  /* ---------- ファイル ---------- */
  if (text.includes('ファイル') || text.includes('動画')) {
    fileInput.click();
    showToast("動画選択");
  }

  /* ---------- 再生 ---------- */
  if (text.includes('再生')) {
    video.play();
    showToast("再生");
  }

  /* ---------- 停止 ---------- */
  if (text.includes('停止') || text.includes('一時停止')) {
    video.pause();
    showToast("停止");
  }

  /* ---------- 音量 ---------- */
  if (text.includes('音量上げて')) {
    video.muted = false;
    video.volume = Math.min(1, video.volume + 0.1);
    showToast(`音量 ${Math.round(video.volume * 100)}%`);
  }

  if (text.includes('音量下げて')) {
    video.volume = Math.max(0, video.volume - 0.1);
    showToast(`音量 ${Math.round(video.volume * 100)}%`);
  }

  if (text.includes('ミュート')) {
    video.muted = true;
    showToast("ミュート");
  }

  if (text.includes('最大音量')) {
    video.muted = false;
    video.volume = 1;
    showToast("最大音量");
  }

  /* ---------- シーク ---------- */
  if (text.includes('10秒進めて')) {
    video.currentTime += 10;
    showToast("+10秒");
  }

  if (text.includes('10秒戻して')) {
    video.currentTime -= 10;
    showToast("-10秒");
  }

  /* ---------- 数値音量 ---------- */
  const match = text.match(/(\d+)\s*%/);
  if (match) {
    let v = Math.min(100, parseInt(match[1]));
    video.muted = false;
    video.volume = v / 100;
    showToast(`音量 ${v}%`);
  }

};

/* =========================
   UI表示
========================= */
function showUI(){
  app.classList.add('ui-visible');
  clearTimeout(uiTimer);
  uiTimer = setTimeout(()=>{
    app.classList.remove('ui-visible');
  },7000);
}

/* =========================
   トースト
========================= */
function showToast(msg){
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(()=>toast.classList.remove('show'),1500);
}

</script>
