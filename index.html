<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice Video Player 完全版</title>

<style>
body { margin:0; background:#000; overflow:hidden; font-family:sans-serif; }
video { width:100vw; height:100vh; object-fit:contain; }

.controls {
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  text-align:center;
}

button {
  padding:10px 20px;
  margin:5px;
  border:none;
  border-radius:10px;
  font-size:16px;
}

#micBtn { background:#ff4f4f; color:#fff; }
#fileBtn { background:#e8c87a; }

.toast {
  position:absolute;
  bottom:30%;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,0.7);
  color:#fff;
  padding:10px 20px;
  border-radius:12px;
  opacity:0;
  transition:0.3s;
}
.toast.show { opacity:1; }

</style>
</head>

<body>

<video id="video"></video>

<div class="controls">
  <button id="fileBtn">動画選択</button>
  <button id="micBtn">🎤 音声開始</button>
</div>

<div id="toast" class="toast"></div>
<input type="file" id="fileInput" accept="video/*">

<script>

/* =========================
   要素
========================= */
const video = document.getElementById("video");
const micBtn = document.getElementById("micBtn");
const fileBtn = document.getElementById("fileBtn");
const fileInput = document.getElementById("fileInput");
const toast = document.getElementById("toast");

/* =========================
   トースト
========================= */
function showToast(text){
  toast.textContent = text;
  toast.classList.add("show");
  setTimeout(()=>toast.classList.remove("show"),1500);
}

/* =========================
   ファイル選択
========================= */
fileBtn.onclick = () => fileInput.click();

fileInput.onchange = (e)=>{
  const file = e.target.files[0];
  if(file){
    video.src = URL.createObjectURL(file);
    video.play();
    showToast("動画再生：" + file.name);

    // 保存（再利用用）
    localStorage.setItem("lastVideoName", file.name);
  }
};

/* =========================
   音声認識
========================= */
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const recognition = new SpeechRecognition();

recognition.lang = 'ja-JP';
recognition.continuous = true;
recognition.interimResults = false;

let recognizing = false;

/* =========================
   マイク
========================= */
micBtn.onclick = () => {
  if(!recognizing){
    recognition.start();
    recognizing = true;
    micBtn.textContent = "🎤 認識中...";
    showToast("音声認識ON");
  }else{
    recognition.stop();
    recognizing = false;
    micBtn.textContent = "🎤 音声開始";
    showToast("音声認識OFF");
  }
};

/* =========================
   音声コマンド
========================= */
recognition.onresult = (event) => {

  const text = event.results[event.results.length - 1][0].transcript.trim();
  console.log("音声:", text);

  /* ===== 動画選択 ===== */
  if(text.includes("動画選択") || text.includes("動画開いて") || text.includes("ファイル開いて")){
    fileInput.click();
    showToast("動画を選択してください");
  }

  /* ===== 再生 ===== */
  else if(text.includes("再生")){
    video.play();
    showToast("再生");
  }

  else if(text.includes("停止") || text.includes("一時停止")){
    video.pause();
    showToast("一時停止");
  }

  /* ===== シーク ===== */
  else if(text.includes("進めて")){
    video.currentTime += 10;
    showToast("10秒進む");
  }

  else if(text.includes("戻して")){
    video.currentTime -= 10;
    showToast("10秒戻る");
  }

  /* ===== 音量 ===== */
  else if(text.includes("音量上げて")){
    video.volume = Math.min(video.volume + 0.1,1);
    showToast("音量：" + Math.round(video.volume*100)+"%");
  }

  else if(text.includes("音量下げて")){
    video.volume = Math.max(video.volume - 0.1,0);
    showToast("音量：" + Math.round(video.volume*100)+"%");
  }

  else if(text.includes("ミュート")){
    video.muted = true;
    showToast("ミュート");
  }

  else if(text.includes("ミュート解除")){
    video.muted = false;
    showToast("ミュート解除");
  }

  else if(text.includes("最大音量")){
    video.volume = 1;
    showToast("音量100%");
  }

  else if(text.includes("音量ゼロ")){
    video.volume = 0;
    showToast("音量0%");
  }

  /* ===== 数値音量 ===== */
  const match = text.match(/音量\s?(\d+)/);
  if(match){
    let vol = parseInt(match[1],10);
    vol = Math.min(Math.max(vol,0),100);
    video.volume = vol/100;
    showToast("音量：" + vol + "%");
  }

  /* ===== 前回動画（疑似） ===== */
  else if(text.includes("前の動画") || text.includes("前回")){
    showToast("前回動画はブラウザ制限で自動再生不可");
  }

};

/* =========================
   自動再開
========================= */
recognition.onend = () => {
  if(recognizing){
    recognition.start();
  }
};

</script>

</body>
</html>
