<script>

/* =========================
   初期設定
========================= */

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const recognition = new SpeechRecognition();

recognition.lang = 'ja-JP';
recognition.continuous = true;
recognition.interimResults = false;

let recognizing = false;

/* =========================
   音声認識スタート（1回押すだけ）
========================= */

micBtn.onclick = () => {
  if(!recognizing){
    recognition.start();
    recognizing = true;
    showToast("音声操作ON");
  }
};

/* 自動再起動（完全ハンズフリー化） */
recognition.onend = () => {
  recognition.start();
};

/* =========================
   コマンド処理
========================= */

recognition.onresult = (e) => {

  const text = e.results[e.results.length - 1][0].transcript;

  console.log("認識:", text);
  showUI();

  /* ---------- ファイル ---------- */
  if (text.includes('ファイル') || text.includes('動画開いて')) {
    fileInput.click();
    showToast("動画選択");
  }

  /* ---------- 再生 ---------- */
  if (text.includes('再生')) {
    video.play();
    showToast("再生");
  }

  /* ---------- 停止 ---------- */
  if (text.includes('停止') || text.includes('一時停止')) {
    video.pause();
    showToast("停止");
  }

  /* ---------- 音量 ---------- */
  if (text.includes('音量上げて')) {
    video.muted = false;
    video.volume = Math.min(1, video.volume + 0.1);
    showToast(`音量 ${Math.round(video.volume * 100)}%`);
  }

  if (text.includes('音量下げて')) {
    video.volume = Math.max(0, video.volume - 0.1);
    showToast(`音量 ${Math.round(video.volume * 100)}%`);
  }

  if (text.includes('ミュート')) {
    video.muted = true;
    showToast("ミュート");
  }

  if (text.includes('最大音量')) {
    video.muted = false;
    video.volume = 1;
    showToast("最大音量");
  }

  /* ---------- シーク ---------- */
  if (text.includes('10秒進めて')) {
    video.currentTime += 10;
    showToast("+10秒");
  }

  if (text.includes('10秒戻して')) {
    video.currentTime -= 10;
    showToast("-10秒");
  }

  /* ---------- 数値音量 ---------- */
  const match = text.match(/(\d+)%/);
  if(match){
    let v = Math.min(100, parseInt(match[1]));
    video.muted = false;
    video.volume = v / 100;
    showToast(`音量 ${v}%`);
  }

};

/* =========================
   UX改善
========================= */

/* 音声検出でUI自動表示 */
function showUI(){
  app.classList.add('ui-visible');
  clearTimeout(uiTimer);
  uiTimer = setTimeout(()=>{
    app.classList.remove('ui-visible');
  },7000);
}

/* トースト */
function showToast(msg){
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(()=>toast.classList.remove('show'),1500);
}

   </script>
