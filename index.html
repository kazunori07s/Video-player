<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CINÉMA</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden}
#app{position:fixed;inset:0;background:#000}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
#blurOverlay{position:absolute;inset:0;background:#000;z-index:5;display:none}
#blurOverlay.on{display:block}
header{position:absolute;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:16px 14px 12px;background:linear-gradient(to bottom,rgba(0,0,0,0.8),transparent)}
.header-btns{display:flex;gap:10px}
.btn{width:48px;height:48px;border-radius:50%;border:1.5px solid rgba(255,255,255,0.3);background:rgba(0,0,0,0.6);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff}
.btn:active{transform:scale(0.92)}
#fileInput{display:none}
#controls{position:absolute;bottom:0;left:0;right:0;z-index:10;padding:16px 14px 24px;background:linear-gradient(to top,rgba(0,0,0,0.8),transparent)}
#seek{width:100%;height:4px;-webkit-appearance:none;background:rgba(255,255,255,0.2);border-radius:2px;outline:none;cursor:pointer}
#seek::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#e8c87a}
#timeLabel{color:rgba(255,255,255,0.6);font-size:12px;font-family:monospace;margin-top:6px;text-align:right}
#playBtn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:10;width:64px;height:64px;border-radius:50%;background:#e8c87a;border:none;cursor:pointer;font-size:28px;display:flex;align-items:center;justify-content:center}
#playBtn:active{transform:translate(-50%,-50%) scale(0.92)}
#toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:20;background:rgba(0,0,0,0.8);color:#fff;padding:10px 20px;border-radius:12px;font-size:15px;pointer-events:none;opacity:0;transition:opacity 0.2s;white-space:nowrap}
#toast.show{opacity:1}
#clock{font-family:monospace;font-size:18px;color:#fff}
/* MODAL */
#helpModal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,0.8);display:none;align-items:center;justify-content:center}
#helpModal.show{display:flex}
.modal-box{background:#151a21;border-radius:16px;padding:24px 20px;width:min(320px,90vw)}
.modal-title{color:#e8c87a;font-size:13px;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:16px;display:flex;justify-content:space-between}
.modal-close{background:none;border:none;color:#fff;font-size:20px;cursor:pointer}
.section-title{font-size:11px;color:rgba(255,255,255,0.4);text-transform:uppercase;margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid rgba(255,255,255,0.1)}
.cmd{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.05);font-size:13px;color:#fff}
.cmd:last-child{border:none}
.cmd span:first-child{color:#e8c87a;background:rgba(232,200,122,0.1);padding:2px 8px;border-radius:6px;font-family:monospace}
.cmd span:last-child{color:rgba(255,255,255,0.5)}
.section{margin-bottom:14px}
</style>
</head>
<body>
<div id="app">
  <video id="video" preload="auto" playsinline></video>
  <div id="blurOverlay"></div>
  <div id="toast"></div>

  <header>
    <div id="clock">--時--分--秒</div>
    <div class="header-btns">
      
      <button class="btn" id="btnOpen">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#e8c87a" stroke-width="2" stroke-linecap="round"><path d="M3 7a2 2 0 0 1 2-2h3.17a2 2 0 0 1 1.42.59l1 1H19a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg>
      </button>
      <button class="btn" id="btnVoice"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#e8c87a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/><path d="M3 10c0 .5.1 1 .2 1.5"/><path d="M20.8 11.5A9 9 0 0 0 21 10"/></svg></button>
      <button class="btn" id="btnHelp">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#e8c87a" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      </button>
      <input type="file" id="fileInput" accept="video/*">
    </div>
  </header>

  <button id="playBtn">▶</button>

  <div id="controls">
    <input type="range" id="seek" min="0" max="100" value="0" step="0.01">
    <div id="timeLabel">0:00 / 0:00</div>
  </div>
</div>

<div id="helpModal">
  <div class="modal-box">
    <div class="modal-title">音声コマンド<button class="modal-close" id="btnHelpClose">✕</button></div>
    <div class="section">
      <div class="section-title">① ぼかしモード</div>
      <div class="cmd"><span>ぼかし</span><span>ON/OFF切替</span></div>
      <div class="cmd"><span>隠せ / 隠す</span><span>ON/OFF切替</span></div>
    </div>
    <div class="section">
      <div class="section-title">② 再生コントロール</div>
      <div class="cmd"><span>再生</span><span>再生開始</span></div>
      <div class="cmd"><span>一時停止</span><span>一時停止</span></div>
      <div class="cmd"><span>○秒戻して</span><span>巻き戻し</span></div>
      <div class="cmd"><span>○秒進めて</span><span>スキップ</span></div>
      <div class="cmd"><span>最初から</span><span>先頭へ</span></div>
      <div class="cmd"><span>最後</span><span>末尾へ</span></div>
    </div>
  </div>
</div>

<script>
var video=document.getElementById('video');
var playBtn=document.getElementById('playBtn');
var seek=document.getElementById('seek');
var timeLabel=document.getElementById('timeLabel');
var blurOverlay=document.getElementById('blurOverlay');
var fileInput=document.getElementById('fileInput');
var btnOpen=document.getElementById('btnOpen');
var btnBlur=document.getElementById('btnBlur');
var btnVoice=document.getElementById('btnVoice');
var btnHelp=document.getElementById('btnHelp');
var btnHelpClose=document.getElementById('btnHelpClose');
var helpModal=document.getElementById('helpModal');
var toast=document.getElementById('toast');
var clock=document.getElementById('clock');
var blurOn=false,pausedByBlur=false,isListening=false,recognition=null,toastTimer=null;

// 時計
setInterval(function(){
  var n=new Date();
  clock.textContent=pad(n.getHours())+'時'+pad(n.getMinutes())+'分'+pad(n.getSeconds())+'秒';
},1000);
function pad(n){return String(n).padStart(2,'0');}

// ファイル
btnOpen.onclick=function(){fileInput.click();};
fileInput.onchange=function(e){
  var f=e.target.files[0];
  if(f&&f.type.startsWith('video/')){
    video.src=URL.createObjectURL(f);
    video.load();
  }
};

// 再生
playBtn.onclick=function(){
  if(!video.src)return;
  if(video.paused||video.ended)video.play();
  else video.pause();
};
video.onplay=function(){playBtn.textContent='⏸';};
video.onpause=function(){playBtn.textContent='▶';};
video.onended=function(){playBtn.textContent='▶';};

// シーク
video.ontimeupdate=function(){
  if(!video.duration)return;
  var p=(video.currentTime/video.duration)*100;
  seek.value=p;
  timeLabel.textContent=fmt(video.currentTime)+' / '+fmt(video.duration);
};
seek.oninput=function(){
  if(video.duration)video.currentTime=(seek.value/100)*video.duration;
};
function fmt(s){
  var h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=Math.floor(s%60);
  return h>0?h+':'+pad(m)+':'+pad(sec):m+':'+pad(sec);
}

// ぼかし
btnBlur.onclick=function(){toggleBlur();};
function toggleBlur(){
  blurOn=!blurOn;
  blurOverlay.className=blurOn?'on':'';
  if(blurOn){if(!video.paused){video.pause();pausedByBlur=true;}video.muted=true;}
  else{if(pausedByBlur){video.play().catch(function(){});pausedByBlur=false;}video.muted=false;}
}

// ヘルプ
btnHelp.onclick=function(){helpModal.className='show';};
btnHelpClose.onclick=function(){helpModal.className='';};
helpModal.onclick=function(e){if(e.target===helpModal)helpModal.className='';};

// トースト
function showToast(msg){
  toast.textContent=msg;toast.className='show';
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){toast.className='';},2200);
}

// 音声認識
function parseSec(t){
  var m=t.match(/(\d+)\s*分/),s=t.match(/(\d+)\s*秒/),n=0;
  if(m)n+=parseInt(m[1])*60;if(s)n+=parseInt(s[1]);return n||10;
}
function handleCmd(text){
  text=text.replace(/\s/g,'');
  if(/再生|プレイ/i.test(text)){video.play().catch(function(){});showToast('▶ 再生');}
  else if(/止|停止|ポーズ/i.test(text)){video.pause();showToast('⏸ 停止');}
  else if(/戻|巻き戻/i.test(text)){var s=parseSec(text);video.currentTime=Math.max(0,video.currentTime-s);showToast('⏪ '+s+'秒戻し');}
  else if(/進|スキップ|飛ば/i.test(text)){var s=parseSec(text);video.currentTime=Math.min(video.duration||0,video.currentTime+s);showToast('⏩ '+s+'秒スキップ');}
  else if(/最初|先頭/i.test(text)){video.currentTime=0;showToast('⏮ 最初から');}
  else if(/最後|終わり/i.test(text)){video.currentTime=video.duration||0;showToast('⏭ 最後へ');}
  else if(/ぼかし|隠せ|隠す/i.test(text)){toggleBlur();showToast(blurOn?'🔒 ぼかし ON':'🔓 ぼかし OFF');}
  else{showToast('「'+text+'」不明');}
}
btnVoice.onclick=function(){
  if(isListening){
    isListening=false;if(recognition)recognition.stop();
    btnVoice.textContent='🎤';showToast('🎤 OFF');return;
  }
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){showToast('音声認識非対応');return;}
  recognition=new SR();recognition.lang='ja-JP';recognition.continuous=false;recognition.interimResults=false;
  recognition.onresult=function(e){handleCmd(e.results[0][0].transcript);};
  recognition.onend=function(){if(isListening){try{recognition.start();}catch(e){}}else{btnVoice.textContent='🎤';}};
  recognition.onerror=function(e){if(e.error==='no-speech'||e.error==='aborted')return;showToast('エラー:'+e.error);isListening=false;btnVoice.textContent='🎤';};
  isListening=true;btnVoice.textContent='🔴';showToast('🎤 ON');recognition.start();
};
</script>
</body>
</html>
