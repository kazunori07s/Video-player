<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Video Player</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --accent: #e8c87a; --danger: #ff4f4f; --muted: rgba(255,255,255,0.28); }
  html, body { height: 100%; background: #000; overflow: hidden; }
  .app { position: fixed; inset: 0; background: #000; }
  video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }

  /* ─── BLACKOUT ─── */
  .blur-overlay { position: absolute; inset: 0; background: #000; z-index: 10; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
  .blur-overlay.active { opacity: 1; pointer-events: auto; }

  /* ─── CLOCK ─── */
  .clock {
    position: absolute;
    top: max(18px, env(safe-area-inset-top));
    left: 16px;
    z-index: 25;
    font-family: 'Courier New', monospace;
    font-size: 20px;
    font-weight: bold;
    color: #fff;
    letter-spacing: 0.02em;
    text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  .app.ui-visible .clock { opacity: 1; }

  /* ─── PLAY BUTTON ─── */
  .play-toggle {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%); z-index: 20;
    width: 72px; height: 72px; border-radius: 50%;
    background: var(--accent); border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 32px rgba(232,200,122,0.35);
    opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
  }
  .app.ui-visible .play-toggle { opacity: 1; pointer-events: auto; }
  .play-toggle:active { filter: brightness(1.15); }
  .play-icon, .pause-icon { position: absolute; transition: opacity 0.2s, transform 0.2s; }
  .play-toggle.paused  .play-icon  { opacity: 1; transform: translateX(2px); }
  .play-toggle.paused  .pause-icon { opacity: 0; transform: scale(0.7); }
  .play-toggle.playing .play-icon  { opacity: 0; transform: scale(0.7); }
  .play-toggle.playing .pause-icon { opacity: 1; transform: none; }

  /* ─── CONTROLS ─── */
  .controls {
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 20;
    padding: 24px 16px max(16px, env(safe-area-inset-bottom));
    background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, transparent 100%);
    display: flex; flex-direction: column; gap: 6px;
    opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
  }
  .app.ui-visible .controls { opacity: 1; pointer-events: auto; }
  .seekbar-row { display: flex; align-items: center; gap: 10px; }
  .time-label { font-family: 'Courier New', monospace; font-size: 11px; color: var(--muted); white-space: nowrap; min-width: 82px; text-align: right; }
  input[type=range] {
    -webkit-appearance: none; width: 100%; height: 3px; border-radius: 2px;
    background: linear-gradient(to right, var(--accent) var(--p, 0%), rgba(255,255,255,0.15) var(--p, 0%));
    outline: none; cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%;
    background: var(--accent); cursor: pointer; box-shadow: 0 0 6px rgba(232,200,122,0.6);
  }

  /* ─── MIC BUTTON ─── */
  .mic-btn {
    position: absolute;
    top: max(16px, env(safe-area-inset-top));
    right: 16px; z-index: 25;
    width: 68px; height: 68px; border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #3a3a3a, #1a1a1a);
    border: 1.5px solid rgba(255,255,255,0.08);
    box-shadow: 0 4px 16px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.08);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
  }
  .mic-btn:active { transform: scale(0.92); }
  .mic-btn.listening {
    background: radial-gradient(circle at 40% 35%, #3a1a1a, #1a0a0a);
    border-color: var(--danger);
    animation: micPulse 1s ease-in-out infinite;
  }
  @keyframes micPulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(255,79,79,0.5); }
    50%      { box-shadow: 0 0 0 14px rgba(255,79,79,0); }
  }
  .mic-btn img { pointer-events: none; transition: opacity 0.2s; }
  .mic-btn.listening img { opacity: 0.5; }

  /* ─── TOAST ─── */
  .toast {
    position: absolute; bottom: 28%; left: 50%; transform: translateX(-50%); z-index: 30;
    background: rgba(0,0,0,0.72); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 14px; padding: 10px 22px;
    font-family: sans-serif; font-size: 14px; color: #fff;
    pointer-events: none; opacity: 0; transition: opacity 0.25s ease;
    white-space: nowrap; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  }
  .toast.show { opacity: 1; }
  #fileInput { display: none; }
</style>
</head>
<body>
<div class="app" id="app">
  <video id="video" preload="auto"></video>
  <div class="blur-overlay" id="blurOverlay"></div>
  <div class="toast" id="toast"></div>
  <input type="file" id="fileInput" accept="video/*">

  <!-- 現在時刻 -->
  <div class="clock" id="clock">--時--分--秒</div>

  <!-- 再生ボタン -->
  <button class="play-toggle paused" id="playBtn">
    <span class="play-icon"><svg width="22" height="22" viewBox="0 0 22 22" fill="#080a0d"><polygon points="5,2 19,11 5,20"/></svg></span>
    <span class="pause-icon"><svg width="20" height="20" viewBox="0 0 20 20" fill="#080a0d"><rect x="2" y="1" width="6" height="18" rx="2"/><rect x="12" y="1" width="6" height="18" rx="2"/></svg></span>
  </button>

  <!-- シークバー -->
  <div class="controls">
    <div class="seekbar-row">
      <input type="range" id="seek" min="0" max="100" value="0" step="0.01">
      <div class="time-label" id="timeLabel">0:00 / 0:00</div>
    </div>
  </div>

  <!-- マイクボタン -->
  <button class="mic-btn" id="btnMic" title="音声コントロール">

  </button>
</div>

<script>
  const video       = document.getElementById('video');
  const playBtn     = document.getElementById('playBtn');
  const seek        = document.getElementById('seek');
  const timeLabel   = document.getElementById('timeLabel');
  const blurOverlay = document.getElementById('blurOverlay');
  const fileInput   = document.getElementById('fileInput');
  const app         = document.getElementById('app');
  const btnMic      = document.getElementById('btnMic');
  const toast       = document.getElementById('toast');
  const clockEl     = document.getElementById('clock');

  let blurOn = false, pausedByMode = false, uiTimer = null;
  let isListening = false, recognition = null, toastTimer = null;

  // ── 時計 ──
  function updateClock() {
    const n = new Date();
    const hh = String(n.getHours()).padStart(2,'0');
    const mm = String(n.getMinutes()).padStart(2,'0');
    const ss = String(n.getSeconds()).padStart(2,'0');
    clockEl.textContent = hh + '時' + mm + '分' + ss + '秒';
  }
  updateClock();
  setInterval(updateClock, 1000);

  // ── UI表示（5秒で消える）──
  function showUI() {
    app.classList.add('ui-visible');
    clearTimeout(uiTimer);
    uiTimer = setTimeout(() => app.classList.remove('ui-visible'), 5000);
  }
  app.addEventListener('click', showUI);
  app.addEventListener('touchstart', showUI, { passive: true });
  document.querySelectorAll('input[type=range], button').forEach(el => {
    el.addEventListener('pointerdown', showUI);
  });

  // ── ファイル ──
  fileInput.addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file || !file.type.startsWith('video/')) return;
    video.src = URL.createObjectURL(file);
    video.load();
    updatePlayBtn();
  });

  // ── 再生 ──
  function updatePlayBtn() {
    const playing = !video.paused && !video.ended;
    playBtn.classList.toggle('playing', playing);
    playBtn.classList.toggle('paused', !playing);
  }
  function togglePlay() {
    if (!video.src) return;
    video.paused ? video.play() : video.pause();
  }
  playBtn.addEventListener('click', e => { e.stopPropagation(); togglePlay(); });
  video.addEventListener('play',  updatePlayBtn);
  video.addEventListener('pause', updatePlayBtn);
  video.addEventListener('ended', updatePlayBtn);

  // ── シーク ──
  video.addEventListener('timeupdate', () => {
    if (!video.duration) return;
    const pct = (video.currentTime / video.duration) * 100;
    seek.value = pct;
    seek.style.setProperty('--p', pct + '%');
    timeLabel.textContent = fmtTime(video.currentTime) + ' / ' + fmtTime(video.duration);
  });
  seek.addEventListener('input', () => {
    if (!video.duration) return;
    video.currentTime = (seek.value / 100) * video.duration;
    seek.style.setProperty('--p', seek.value + '%');
    showUI();
  });
  function fmtTime(s) {
    const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = Math.floor(s%60);
    return h > 0 ? h+':'+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0') : m+':'+String(sec).padStart(2,'0');
  }

  // ── ぼかし ──
  function applyBlur(on) {
    blurOn = on;
    blurOverlay.classList.toggle('active', on);
    if (on) { if (!video.paused) { video.pause(); pausedByMode = true; } }
    else    { if (pausedByMode)  { video.play().catch(()=>{}); pausedByMode = false; } }
    video.muted = on;
  }

  // ── トースト ──
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
  }

  // ── 秒数パース ──
  function parseSeconds(text) {
    let total = 0;
    const min = text.match(/(\d+)\s*分/);
    const sec = text.match(/(\d+)\s*秒/);
    if (min) total += parseInt(min[1]) * 60;
    if (sec) total += parseInt(sec[1]);
    return total || 10;
  }

  // ── コマンド処理 ──
  function handleCommand(text) {
    text = text.replace(/\s/g, '');
    showUI();
    if (/再生|プレイ/.test(text)) {
      video.play().catch(()=>{});
      showToast('▶ 再生');
    } else if (/止|停止|ポーズ|一時停止/.test(text)) {
      video.pause();
      showToast('⏸ 一時停止');
    } else if (/戻|巻き戻/.test(text)) {
      const s = parseSeconds(text);
      video.currentTime = Math.max(0, video.currentTime - s);
      showToast('⏪ ' + s + '秒戻しました');
    } else if (/進|スキップ|飛ば/.test(text)) {
      const s = parseSeconds(text);
      video.currentTime = Math.min(video.duration||0, video.currentTime + s);
      showToast('⏩ ' + s + '秒進みました');
    } else if (/最初|はじめ|先頭/.test(text)) {
      video.currentTime = 0;
      showToast('⏮ 最初から');
    } else if (/ぼかし/.test(text) && /オン|on|入|つけ|開始/i.test(text)) {
      applyBlur(true);
      showToast('🔒 ぼかし ON');
    } else if (/ぼかし/.test(text) && /オフ|off|切|消|解除/i.test(text)) {
      applyBlur(false);
      showToast('🔓 ぼかし OFF');
    } else if (/ぼかし/.test(text)) {
      applyBlur(!blurOn);
      showToast(blurOn ? '🔒 ぼかし ON' : '🔓 ぼかし OFF');
    } else if (/ファイル|動画|開|選択|追加/.test(text)) {
      fileInput.click();
      showToast('📂 ファイル選択');
    } else {
      showToast('「' + text + '」— 認識できませんでした');
    }
  }

  // ── 音声認識（ONにしたらOFFまで継続）──
  function setupRecognition() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { showToast('このブラウザは音声認識非対応です'); return null; }
    const r = new SR();
    r.lang = 'ja-JP'; r.continuous = false; r.interimResults = false;
    r.onresult = e => handleCommand(e.results[0][0].transcript);
    r.onend = () => {
      if (isListening) { try { r.start(); } catch(_) {} }
      else { btnMic.classList.remove('listening'); }
    };
    r.onerror = e => {
      if (e.error === 'no-speech' || e.error === 'aborted') return;
      showToast('エラー: ' + e.error);
      isListening = false;
      btnMic.classList.remove('listening');
    };
    return r;
  }

  btnMic.addEventListener('click', e => {
    e.stopPropagation();
    if (isListening) {
      isListening = false;
      recognition && recognition.stop();
      btnMic.classList.remove('listening');
      showToast('🎤 音声認識 OFF');
      return;
    }
    recognition = setupRecognition();
    if (!recognition) return;
    isListening = true;
    btnMic.classList.add('listening');
    showToast('🎤 音声認識 ON');
    recognition.start();
  });

  // ── キーボード ──
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.code === 'Space')      { e.preventDefault(); togglePlay(); }
    if (e.code === 'ArrowLeft')  { e.preventDefault(); video.currentTime = Math.max(0, video.currentTime - 10); }
    if (e.code === 'ArrowRight') { e.preventDefault(); video.currentTime = Math.min(video.duration||0, video.currentTime + 10); }
  });
</script>
